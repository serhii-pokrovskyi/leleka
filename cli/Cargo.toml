[package]
name = "leleka"
description = "Command-line fastlane alternative: upload mobile app builds to App Store Connect and Google Play"
keywords = ["app-store-connect", "google-play", "testflight", "fastlane", "mobile"]
categories = ["command-line-utilities", "development-tools"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
leleka-core = { workspace = true }
